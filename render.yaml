services:
  - type: web
    name: authflow-react-flask
    runtime: python
    region: ohio
    plan: free
    buildCommand: ./render_build.sh
    startCommand: gunicorn --chdir ./src --workers 1 --bind 0.0.0.0:$PORT wsgi:application
    healthCheckPath: /api/health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: 0
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: NODE_VERSION
        value: 24.18.0
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: authflow-db
          property: connectionString

databases:
  - name: authflow-db
    region: ohio
    plan: free
