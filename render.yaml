services:
  - type: web
    name: authflow-react-flask
    runtime: python
    region: ohio
    plan: free
    buildCommand: ./render_build.sh
    startCommand: gunicorn --chdir ./src --workers 1 --bind 0.0.0.0:$PORT wsgi:application
    healthCheckPath: /api/health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: 0
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: NODE_VERSION
        value: 24.18.0
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: authflow-db
          property: connectionString
      - key: RATELIMIT_STORAGE_URI
        fromService:
          type: keyvalue
          name: authflow-rate-limits
          property: connectionString
      - key: EMAIL_DELIVERY
        value: smtp
      - key: REQUIRE_EMAIL_VERIFICATION
        value: true
      - key: PASSWORD_BREACH_CHECK
        value: true
      - key: FRONTEND_URL
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false

  - type: keyvalue
    name: authflow-rate-limits
    region: ohio
    plan: free
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

databases:
  - name: authflow-db
    region: ohio
    plan: free
